name: Static UI and public-repository safety checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/core/navigation.js
          node --check src/views/screens.js
          node --check scripts/mobile-smoke.mjs
      - name: Validate isolated GAS STAGING contract
        run: node scripts/gas-contract-test.mjs
      - name: Validate manual-payment ledger (synthetic STAGING)
        run: node scripts/gas-payments-test.mjs
      - name: Check static app and public repository baseline
        run: node scripts/check-static.mjs
      - name: Install browser test driver (CI only)
        run: npm install --no-save playwright@1.56.1
      - name: Test mobile and desktop layout in headless Chrome
        run: node scripts/mobile-smoke.mjs
      - name: Build single-file GAS STAGING installation bundle
        if: always()
        run: node scripts/bundle-gas.mjs
      - name: Upload GAS STAGING source package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmfiber-staging-gas-source
          path: dist/Code.gs
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload public UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmfiber-public-ui-viewport-screenshots
          path: test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
